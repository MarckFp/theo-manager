[package]
name = "theo-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Theo Manager: the app (screens, routes, wiring). UI comes only from theo-ui."
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
theo-ui = { path = "../theo-ui" }
web-time = "1"
# UI translations (Fluent). Strings are not translated yet; the language switch works.
dioxus-i18n = "0.6"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
# Saving exports as a download (already in the tree through dioxus-web).
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Url", "Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
