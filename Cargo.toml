# Theo Manager: one repository, one Cargo workspace (decision D-25).
#   theo-ui   design system (components, styles, icons)
#   theo-core    domain models, rules, eligibility and permissions
#   theo-crypto  cryptography (vault, key domains, envelopes, PQC grants and signatures)
#   theo-app  the app for web, desktop and mobile
#   theo-db      storage: one Db API over SQLite, IndexedDB and memory (SurrealDB next)

[workspace]
resolver = "3"
members = ["theo-crypto", "theo-db", "theo-core", "theo-ui", "theo-app"]

# Profiles live here: Cargo ignores profiles in member crates.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Web release: `strip` removes the custom sections wasm-bindgen needs, so it stays off here.
# dx runs wasm-opt afterwards, which removes debug data anyway.
[profile.wasm-release]
inherits = "release"
strip = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# Argon2 is far too slow without optimisation; keep it fast in debug builds too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
