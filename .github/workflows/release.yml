# Builds every platform when a GitHub release is published from a tag on main, attaches the
# packages to that release, and deploys the web build to GitHub Pages.
#
# How to release:  create a release in GitHub with a new tag like v0.2.0 (target: main).
# The tag gives the version (a leading "v" is optional).
#
# No signing secrets yet (REQUIREMENTS.md R-704): desktop installers are unsigned, the Android
# packages use the debug key, and the iOS .ipa is unsigned (install it only with your own signing).

name: Release 🚀

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DX_VERSION: "0.7.10"
  # Android NDK: https://developer.android.com/ndk/downloads
  NDK_VERSION: "29.0.14206865"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag 🏷️
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main 🔒
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The release tag ${{ github.event.release.tag_name }} is not on main."
            exit 1
          }

      - name: Version from tag 📝
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  web:
    name: Web 🌐
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the zip to the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set version 📝
        run: sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" theo-app/Cargo.toml

      - name: Setup Rust 🦀
        run: rustup target add wasm32-unknown-unknown

      - name: Install Cargo Binstall 🛠️
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI 🛠️
        run: cargo binstall "dioxus-cli@$DX_VERSION" -y --force

      - name: Build 🏗️
        working-directory: theo-app
        # GitHub Pages serves the site under /<repository name>/.
        run: dx build --release --platform web --base-path "${{ github.event.repository.name }}"

      - name: Finish for static hosting ✨
        run: python3 scripts/web-postbuild.py target/dx/theo-app/release/web/public

      - name: Attach to the release 📦
        run: |
          (cd target/dx/theo-app/release/web/public && zip -qr "$GITHUB_WORKSPACE/theo-manager_${VERSION}_web.zip" .)
          gh release upload "${{ github.event.release.tag_name }}" "theo-manager_${VERSION}_web.zip" --clobber

      - name: Upload GitHub Pages 📤
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/dx/theo-app/release/web/public/

  pages:
    name: GitHub Pages 🌍
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5

  bundle:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach the packages to the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64 🪟", os: windows-2025, platform: desktop, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { name: "Windows x86 🪟", os: windows-2025, platform: desktop, target: i686-pc-windows-msvc, label: windows-x86 }
          - { name: "Windows ARM64 🪟", os: windows-2025, platform: desktop, target: aarch64-pc-windows-msvc, label: windows-arm64 }
          - { name: "macOS x64 🍏", os: macos-15, platform: desktop, target: x86_64-apple-darwin, label: macos-x64 }
          - { name: "macOS ARM64 🍏", os: macos-15, platform: desktop, target: aarch64-apple-darwin, label: macos-arm64 }
          - { name: "Linux x64 🐧", os: ubuntu-24.04, platform: desktop, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { name: "Linux ARM64 🐧", os: ubuntu-24.04-arm, platform: desktop, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
          - { name: "Android 🤖", os: ubuntu-24.04, platform: android, target: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android, label: android }
          - { name: "iOS 📱", os: macos-15, platform: ios, target: aarch64-apple-ios, label: ios }
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set version 📝
        shell: bash
        run: |
          sed -i.bak "1,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" theo-app/Cargo.toml
          rm theo-app/Cargo.toml.bak

      - name: Setup Rust 🦀
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Linux libraries 🐧
        if: runner.os == 'Linux' && matrix.platform == 'desktop'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm

      - name: Setup Java ☕
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "21"

      - name: Setup Android 🤖
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android NDK 🤖
        if: matrix.platform == 'android'
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Cargo Binstall 🛠️
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI 🛠️
        shell: bash
        run: cargo binstall "dioxus-cli@$DX_VERSION" -y --force

      - name: Build and bundle 🏗️
        shell: bash
        working-directory: theo-app
        run: |
          case "${{ matrix.platform }}" in
            desktop) dx bundle --release --platform desktop --target "${{ matrix.target }}" --out-dir "$GITHUB_WORKSPACE/dist" ;;
            android) dx bundle --release --platform android --out-dir "$GITHUB_WORKSPACE/dist" ;;
            ios)     dx bundle --release --platform ios --out-dir "$GITHUB_WORKSPACE/dist" ;;
          esac

      - name: Attach to the release 📦
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p upload
          cd dist
          # iOS: an unsigned .app becomes an .ipa (Payload/<app>.app, zipped).
          for app in *.app; do
            if [[ "${{ matrix.platform }}" == "ios" ]]; then
              mkdir -p Payload && cp -R "$app" Payload/
              zip -qr "../upload/theo-manager_${VERSION}_ios.ipa" Payload
            fi
          done
          for f in *.msi *.exe *.dmg *.deb *.rpm *.AppImage *.apk *.aab; do
            ext="${f##*.}"
            stem="theo-manager_${VERSION}_${{ matrix.label }}"
            case "$f" in
              *-setup.exe) name="${stem}-setup.exe" ;;
              *) name="${stem}.${ext}" ;;
            esac
            cp "$f" "../upload/$name"
          done
          cd ..
          ls -la upload
          files=(upload/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No packages were produced for ${{ matrix.name }}."
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
