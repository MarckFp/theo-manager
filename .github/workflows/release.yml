# Builds every platform when a GitHub release is published from a tag on main, attaches the
# packages to that release, and deploys the web build to GitHub Pages.
#
# How to release:  create a release in GitHub with a new tag like v0.2.0 (target: main).
# The tag gives the version (a leading "v" is optional).
#
# Signing (REQUIREMENTS.md R-704): the Android .apk and .aab are signed with the release key when
# the repository has the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (how to make them: docs/release-signing.md). Without
# them the .apk uses a debug key and the .aab is unsigned. Desktop installers and the iOS .ipa are
# not signed yet.
#
# Icons: only theo-app/icons/icon.svg is in the repository. scripts/icons.sh generates every
# platform icon from it (Tauri CLI `icon` command). dx 0.7 has no setting for Android and iOS
# icons, so the workflow puts them into the generated Android project and the iOS app itself.

name: Release 🚀

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DX_VERSION: "0.7.10"
  # Android NDK: https://developer.android.com/ndk/downloads
  NDK_VERSION: "30.0.16248370"
  # Java only runs Gradle (the app is compiled for Java 17). Stay on 21 (LTS) until dx's Android
  # template moves past AGP 8.7.0 and Kotlin 2.0.20, which predate Java 25; Gradle 9.1 alone is fine.
  JAVA_VERSION: "21"
  # zipalign and apksigner, to sign the Android .apk.
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Only its `icon` command is used: https://v2.tauri.app/reference/cli/#icon
  TAURI_CLI_VERSION: "2.12.6"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag 🏷️
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main 🔒
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The release tag ${{ github.event.release.tag_name }} is not on main."
            exit 1
          }

      - name: Version from tag 📝
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  web:
    name: Web 🌐
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the zip to the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set version 📝
        run: sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" theo-app/Cargo.toml

      - name: Setup Rust 🦀
        run: rustup target add wasm32-unknown-unknown

      - name: Install Cargo Binstall 🛠️
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI 🛠️
        run: cargo binstall "dioxus-cli@$DX_VERSION" -y --force

      - name: Build 🏗️
        working-directory: theo-app
        # GitHub Pages serves the site under /<repository name>/.
        run: dx build --release --platform web --base-path "${{ github.event.repository.name }}"

      - name: Install Tauri CLI (icons) 🛠️
        run: cargo binstall "tauri-cli@$TAURI_CLI_VERSION" -y --force

      - name: Generate icons 🎨
        run: bash scripts/icons.sh

      # Installable web app (PWA): manifest, icons and a service worker that keeps the files offline.
      - name: Finish for static hosting ✨
        run: |
          python3 scripts/web-postbuild.py target/dx/theo-manager/release/web/public \
            --base "/${{ github.event.repository.name }}/" --version "$VERSION" --icons theo-app/icons/gen

      - name: Attach to the release 📦
        run: |
          (cd target/dx/theo-manager/release/web/public && zip -qr "$GITHUB_WORKSPACE/theo-manager_${VERSION}_web.zip" .)
          gh release upload "${{ github.event.release.tag_name }}" "theo-manager_${VERSION}_web.zip" --clobber

      - name: Upload GitHub Pages 📤
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/dx/theo-manager/release/web/public/

  pages:
    name: GitHub Pages 🌍
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5

  bundle:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    # Signing secrets live only in the protected `release` environment (R-704); give it a
    # required reviewer so a release waits for approval before it can use them.
    environment: release
    permissions:
      contents: write # attach the packages to the release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows x64 🪟", os: windows-2025, platform: desktop, target: x86_64-pc-windows-msvc, label: windows-x64 }
          - { name: "Windows x86 🪟", os: windows-2025, platform: desktop, target: i686-pc-windows-msvc, label: windows-x86 }
          - { name: "Windows ARM64 🪟", os: windows-2025, platform: desktop, target: aarch64-pc-windows-msvc, label: windows-arm64 }
          - { name: "macOS x64 🍏", os: macos-15, platform: desktop, target: x86_64-apple-darwin, label: macos-x64 }
          - { name: "macOS ARM64 🍏", os: macos-15, platform: desktop, target: aarch64-apple-darwin, label: macos-arm64 }
          - { name: "Linux x64 🐧", os: ubuntu-24.04, platform: desktop, target: x86_64-unknown-linux-gnu, label: linux-x64 }
          - { name: "Linux ARM64 🐧", os: ubuntu-24.04-arm, platform: desktop, target: aarch64-unknown-linux-gnu, label: linux-arm64 }
          - { name: "Android 🤖", os: ubuntu-24.04, platform: android, target: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android, label: android }
          - { name: "iOS 📱", os: macos-15, platform: ios, target: aarch64-apple-ios, label: ios }
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set version 📝
        shell: bash
        run: |
          sed -i.bak "1,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" theo-app/Cargo.toml
          rm theo-app/Cargo.toml.bak

      - name: Setup Rust 🦀
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Linux libraries 🐧
        if: runner.os == 'Linux' && matrix.platform == 'desktop'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev rpm

      - name: Setup Java ☕
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android 🤖
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and build tools 🤖
        if: matrix.platform == 'android'
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;$ANDROID_BUILD_TOOLS"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Cargo Binstall 🛠️
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI 🛠️
        shell: bash
        run: cargo binstall "dioxus-cli@$DX_VERSION" -y --force

      - name: Install Tauri CLI (icons) 🛠️
        shell: bash
        run: cargo binstall "tauri-cli@$TAURI_CLI_VERSION" -y --force

      # dx strips the release binary with Rust's rust-objcopy. On macOS that tool looks for
      # libLLVM.dylib next to it (lib/rustlib/<host>/lib), but the toolchain keeps it in lib/, and
      # dx only passes LD_LIBRARY_PATH (Linux). Link the library where the tool looks; if it is not
      # found, build this job without stripping instead.
      - name: macOS strip tool fix 🍏
        if: runner.os == 'macOS'
        run: |
          sysroot=$(rustc --print sysroot)
          host=$(rustc -vV | sed -n 's/^host: //p')
          lib=$(find "$sysroot/lib" -maxdepth 1 -name 'libLLVM*.dylib' | head -1)
          if [[ -n "$lib" ]]; then
            mkdir -p "$sysroot/lib/rustlib/$host/lib"
            ln -sf "$lib" "$sysroot/lib/rustlib/$host/lib/libLLVM.dylib"
            echo "Linked $lib for rust-objcopy"
          else
            echo "::warning::libLLVM.dylib not found: building without stripping the binary."
            sed -i.bak 's/^strip = true/strip = false/' Cargo.toml && rm Cargo.toml.bak
          fi

      - name: Generate icons 🎨
        shell: bash
        run: bash scripts/icons.sh

      - name: Build and bundle 🏗️
        shell: bash
        working-directory: theo-app
        run: |
          case "${{ matrix.platform }}" in
            desktop) dx bundle --release --platform desktop --target "${{ matrix.target }}" --out-dir "$GITHUB_WORKSPACE/dist" ;;
            android) dx bundle --release --platform android --out-dir "$GITHUB_WORKSPACE/dist" ;;
            ios)     dx bundle --release --platform ios --out-dir "$GITHUB_WORKSPACE/dist" ;;
          esac

      # dx writes its default launcher icons into the Android project, always uses version code 1
      # and only copies the .aab. Put our icons in, set the version code from the tag (Android
      # only installs an update with a higher one), build again with Gradle (the Rust libraries
      # are already in the project), and sign the .apk and the .aab with the release key.
      - name: Android icons, version and signing 🤖
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          project=target/dx/theo-manager/release/android/app
          res="$project/app/src/main/res"
          test -d "$res" || { echo "::error::No Android project at $project"; exit 1; }
          rm -f "$res"/mipmap-*/ic_launcher*.webp "$res"/mipmap-*/ic_launcher*.png \
            "$res"/drawable/ic_launcher_background.xml "$res"/drawable-v24/ic_launcher_foreground.xml
          cp -R theo-app/icons/gen/android/. "$res/"

          # Version code from the tag: 1.2.3 -> 10203 (pre-release suffixes are ignored).
          IFS=. read -r major minor patch <<< "${VERSION%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          sed -i "s/versionCode = [0-9]*/versionCode = $code/" "$project/app/build.gradle.kts"
          echo "Android version code: $code"

          rm -f dist/*.aab dist/*.apk
          out="$project/app/build/outputs"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            # Keys made with Java 9 or later (PKCS12) have no password of their own: the key
            # password is the keystore password.
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            (cd "$project" && chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease)
            keystore="$RUNNER_TEMP/release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
            "$tools/zipalign" -p -f 4 "$out/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out dist/theo-manager.apk "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify dist/theo-manager.apk
            jarsigner -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar dist/theo-manager.aab "$out/bundle/release/app-release.aab" "$ANDROID_KEY_ALIAS"
            jarsigner -verify dist/theo-manager.aab > /dev/null
            rm -f "$keystore"
          else
            echo "::warning::No Android signing secrets: the .apk uses a debug key (a new one every build, so it cannot update an earlier install) and the .aab is unsigned. See docs/release-signing.md."
            (cd "$project" && chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease)
            cp "$out/apk/debug/app-debug.apk" dist/theo-manager.apk
            cp "$out/bundle/release/app-release.aab" dist/theo-manager.aab
          fi

      # dx 0.7 builds the iOS app without an icon: compile an asset catalog with the 1024 px icon
      # into the app and merge its Info.plist keys.
      - name: iOS icon 📱
        if: matrix.platform == 'ios'
        run: |
          shopt -s nullglob
          apps=(dist/*.app)
          test ${#apps[@]} -gt 0 || { echo "::error::No .app in dist"; exit 1; }
          set_dir="$RUNNER_TEMP/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$set_dir"
          cp theo-app/icons/gen/ios/AppIcon-512@2x.png "$set_dir/icon-1024.png"
          printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$set_dir/Contents.json"
          printf '%s' '{"info":{"author":"xcode","version":1}}' > "$RUNNER_TEMP/Assets.xcassets/Contents.json"
          for app in "${apps[@]}"; do
            xcrun actool "$RUNNER_TEMP/Assets.xcassets" --compile "$app" --platform iphoneos \
              --minimum-deployment-target 15.0 --app-icon AppIcon --target-device iphone --target-device ipad \
              --output-partial-info-plist "$RUNNER_TEMP/icon-info.plist"
            /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/icon-info.plist" "$app/Info.plist"
          done

      - name: Attach to the release 📦
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p upload
          cd dist
          # iOS: an unsigned .app becomes an .ipa (Payload/<app>.app, zipped).
          for app in *.app; do
            if [[ "${{ matrix.platform }}" == "ios" ]]; then
              mkdir -p Payload && cp -R "$app" Payload/
              zip -qr "../upload/theo-manager_${VERSION}_ios.ipa" Payload
            fi
          done
          for f in *.msi *.exe *.dmg *.deb *.rpm *.AppImage *.apk *.aab; do
            ext="${f##*.}"
            stem="theo-manager_${VERSION}_${{ matrix.label }}"
            case "$f" in
              *-setup.exe) name="${stem}-setup.exe" ;;
              *) name="${stem}.${ext}" ;;
            esac
            cp "$f" "../upload/$name"
          done
          cd ..
          ls -la upload
          files=(upload/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No packages were produced for ${{ matrix.name }}."
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
