name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include real personal data** (names, phone numbers, reports) in this issue or in screenshots.
        For a security problem, use **Security → Report a vulnerability** instead.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Users › All users\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Web, Windows, macOS, Linux, Android, iOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
