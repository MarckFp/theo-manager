[package]
name = "theo-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Theo Manager design system: the only source of UI components (REQUIREMENTS.md 8.2, 8.4)"
publish = false

[dependencies]
dioxus = { version = "0.7.10" }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[features]
# Renderer features are only used by the gallery example:
#   dx serve --example gallery --platform web      (or --platform desktop)
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
