[package]
name = "theo-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Theo Manager domain: models of every module, rules, eligibility and permissions (REQUIREMENTS.md 9.1). No UI, no network."
publish = false

[dependencies]
# Key domains of the collections (collections.rs).
theo-crypto = { path = "../theo-crypto" }
# Encrypted storage (store.rs).
theo-db = { path = "../theo-db" }
# Record payloads are CBOR (R-306). ciborium keeps JSON null as CBOR null (minicbor-serde
# writes it as an empty array, which loses `None`).
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# The clock (today, now). Pure Rust natively; js-sys Date in the browser (no web-sys).
web-time = "1"
# Reading the workbook EPUB (workbook.rs): deflate only, pure Rust.
miniz_oxide = "0.9"

[dev-dependencies]
pollster = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# No crashing shortcuts in shipped code (tests may panic: clippy.toml).
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
